<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Search System</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
        }

        .system-panel {
            width: 800px;
            height: 500px;
            border: 1px solid #333;

            background: linear-gradient(180deg, #fff 0%, #7f7f7f 100%);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .title {
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            color: #000;
            margin: 0;

            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 15px;
            margin: 5px 0 35px 0;
            color: #222;
        }

        .search-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 45px;
            padding-left: 15px;
        }

        .postal-mark {
            font-size: 25px;
            font-weight: bold;
        }

        .zip-input {
            width: 240px;
            padding: 10px 15px;
            font-size: 15px;
            border: 1.5px solid #333;
            border-radius: 20px;
            background-color: #f2f2f2;
            text-align: center;
            outline: none;
        }

        .search-btn {
            background-color: #fff;
            border: 1.5px solid #333;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 20px;

            display: flex;
            align-items: center;
            justify-content: center;
        }
            
        .search-btn:hover {
                background-color: #f0f0f0
            } 

        .search-btn:active {
                background-color:  #8d8d8d;
                box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.3);
                transform: scale(0.95);
            }
        

        .result-box {
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 15px;
            width: 550px;
            height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 15px;
            color: #7f7f7f;
        }

        .copy-container {
            width: 550px;
            text-align: left;
            margin-top: 10px;
        }

        .copy-link {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            padding: 0;
        }

        
    </style>
</head>


<body>
    <div class="system-panel">

        <h1 class="title">Address Search System</h1>
        <p class="subtitle">郵便番号から住所検索</p>

        <div class="search-area">
            <span class="postal-mark">〒</span>
            <input type="text" class="zip-input" placeholder="郵便番号を入力">
            <button class="search-btn">🔍</button>
        </div>

        <div class="result-box" id="target-text">検索結果</div>

        <div class="copy-container">
            <button class="copy-link" onclick="copyText()">📃<u>Copy</u></button>
        </div>

    </div>

    <script>
        function copyText() {
            const boxElement = document.getElementById('target-text');
            const fullText = boxElement.innerText;
            
            const addressText = fullText.replace('📍', '').trim();

            navigator.clipboard.writeText(addressText).then(() => {
                
                const btn = document.querySelector('.copy-link');
                btn.innerHTML = '✅ <u>Copied!</u>';

                setTimeout(() => {
                    btn.innerHTML = '📋 <u>Copy</u>';
                }, 1500);

            }).catch(err => {
                alert('コピーに失敗しました: ' + err);
            });
        }
    </script>

</body>
</html>
